<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lunch Spin Wheel</title>
  <style>
    :root {
      --bg-1: #fff7ed;
      --bg-2: #eef2ff;
      --ink: #1f2937;
      --muted: #6b7280;
      --card: rgba(255, 255, 255, 0.88);
      --border: rgba(255, 255, 255, 0.55);
      --shadow: 0 24px 70px rgba(31, 41, 55, 0.18);
      --accent: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      text-align: center;
      background:
        radial-gradient(circle at top left, #fed7aa 0, transparent 33%),
        radial-gradient(circle at bottom right, #c7d2fe 0, transparent 36%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      overflow-x: hidden;
    }

    .page {
      width: min(960px, 100%);
      margin: 0 auto;
    }

    .hero {
      margin: 8px auto 22px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      color: #92400e;
      background: rgba(255, 247, 237, 0.86);
      border: 1px solid rgba(251, 146, 60, 0.25);
      box-shadow: 0 8px 22px rgba(251, 146, 60, 0.12);
    }

    h1 {
      margin: 14px 0 8px;
      font-size: clamp(36px, 7vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    .subtitle {
      max-width: 570px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.45;
    }

    .app-card {
      position: relative;
      width: min(760px, 100%);
      margin: 24px auto 0;
      padding: clamp(18px, 4vw, 34px);
      border-radius: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .app-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(120deg, rgba(255,255,255,0.75), transparent 42%),
        radial-gradient(circle at 18% 10%, rgba(255,255,255,0.95), transparent 20%);
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .wheel-area {
      display: grid;
      place-items: center;
    }

    .wheel-container {
      position: relative;
      width: min(82vw, 470px);
      height: min(82vw, 470px);
      margin: 8px auto 20px;
      filter: drop-shadow(0 24px 28px rgba(17, 24, 39, 0.18));
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: white;
    }

    .rim {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 10px solid rgba(255,255,255,0.75);
      box-shadow:
        inset 0 0 0 2px rgba(17,24,39,0.06),
        0 12px 35px rgba(17,24,39,0.15);
      pointer-events: none;
    }

    .pointer-wrap {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      filter: drop-shadow(0 8px 9px rgba(0,0,0,0.22));
    }

    .pointer {
      width: 54px;
      height: 62px;
      background: linear-gradient(180deg, #111827, #374151);
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      border-radius: 10px;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
      font-weight: 800;
      transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease;
    }

    button:active {
      transform: translateY(1px) scale(0.99);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #spinButton {
      position: relative;
      min-width: 190px;
      padding: 16px 34px;
      border-radius: 18px;
      color: white;
      font-size: 22px;
      background: linear-gradient(135deg, #111827, #4f46e5);
      box-shadow: 0 16px 30px rgba(79, 70, 229, 0.28);
      overflow: hidden;
    }

    #spinButton::after {
      content: "";
      position: absolute;
      top: -120%;
      left: -30%;
      width: 80px;
      height: 300%;
      transform: rotate(24deg);
      background: rgba(255,255,255,0.22);
      transition: left 0.45s ease;
    }

    #spinButton:hover::after {
      left: 120%;
    }

    .secondary-button {
      padding: 12px 18px;
      border-radius: 15px;
      color: #111827;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(17,24,39,0.08);
      box-shadow: 0 10px 24px rgba(17,24,39,0.08);
      font-size: 15px;
    }

    #resultCard {
      display: none;
      width: min(500px, 100%);
      margin: 22px auto 0;
      padding: 18px 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,255,255,0.96), rgba(255,247,237,0.88));
      border: 1px solid rgba(251, 146, 60, 0.25);
      box-shadow: 0 18px 35px rgba(251, 146, 60, 0.14);
    }

    .result-label {
      color: #92400e;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 900;
    }

    #result {
      font-size: clamp(30px, 6vw, 46px);
      font-weight: 950;
      margin-top: 3px;
      letter-spacing: -0.04em;
    }

    details {
      width: min(620px, 100%);
      margin: 26px auto 0;
      text-align: left;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(17,24,39,0.08);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(17,24,39,0.08);
      overflow: hidden;
    }

    summary {
      cursor: pointer;
      padding: 16px 18px;
      font-weight: 900;
      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: "＋";
      float: right;
      color: #6b7280;
    }

    details[open] summary::after {
      content: "−";
    }

    .editor {
      padding: 0 18px 18px;
    }

    .editor p {
      color: var(--muted);
      margin: 0 0 10px;
      line-height: 1.4;
    }

    textarea {
      width: 100%;
      min-height: 145px;
      resize: vertical;
      border: 1px solid rgba(17,24,39,0.12);
      border-radius: 16px;
      padding: 13px;
      font: 16px/1.45 inherit;
      outline: none;
      background: rgba(255,255,255,0.88);
      color: var(--ink);
    }

    textarea:focus {
      border-color: rgba(79, 70, 229, 0.65);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .small-button {
      margin-top: 12px;
      padding: 11px 16px;
      border-radius: 14px;
      color: white;
      background: #111827;
      font-size: 15px;
    }

    .footer-note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 520px) {
      body {
        padding: 20px 12px;
      }

      .app-card {
        border-radius: 24px;
      }

      .wheel-container {
        margin-top: 10px;
      }

      #spinButton {
        width: 100%;
      }

      .secondary-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="badge">Lunch Decider</div>
      <h1>Where should we eat?</h1>
      <p class="subtitle">Add the lunch options, send this page around, and let the wheel decide.</p>
    </section>

    <section class="app-card">
      <div class="content">
        <div class="wheel-area">
          <div class="wheel-container">
            <div class="pointer-wrap"><div class="pointer"></div></div>
            <canvas id="wheel" width="700" height="700"></canvas>
            <div class="rim"></div>
          </div>

          <div class="button-row">
            <button id="spinButton">Spin the Wheel</button>
            <button class="secondary-button" onclick="resetWheel()">Reset</button>
          </div>

          <div id="resultCard">
            <div class="result-label">Today’s pick</div>
            <div id="result"></div>
          </div>
        </div>

        <details>
          <summary>Edit lunch options</summary>
          <div class="editor">
            <p>Put one place per line, then click update.</p>
            <textarea id="optionsBox">Pizza
Burgers
Sushi
Mexican
Chinese
Mediterranean
Deli
Salad</textarea>
            <button class="small-button" onclick="updateOptions()">Update Wheel</button>
          </div>
        </details>

        <div class="footer-note">Tip: save or text this HTML file so anyone can open it in a browser.</div>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinButton = document.getElementById("spinButton");
    const result = document.getElementById("result");
    const resultCard = document.getElementById("resultCard");

    let options = [
      "Pizza",
      "Burgers",
      "Sushi",
      "Mexican",
      "Chinese",
      "Mediterranean",
      "Deli",
      "Salad"
    ];

    let currentRotation = -Math.PI / 2;
    let spinning = false;

    const colors = [
      ["#fb7185", "#e11d48"],
      ["#fb923c", "#ea580c"],
      ["#facc15", "#ca8a04"],
      ["#4ade80", "#16a34a"],
      ["#2dd4bf", "#0f766e"],
      ["#38bdf8", "#0284c7"],
      ["#818cf8", "#4f46e5"],
      ["#c084fc", "#9333ea"],
      ["#f472b6", "#db2777"],
      ["#a3e635", "#65a30d"]
    ];

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawWheel() {
      const center = canvas.width / 2;
      const radius = center - 24;
      const slice = (2 * Math.PI) / options.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < options.length; i++) {
        const start = currentRotation + i * slice;
        const end = start + slice;
        const gradient = ctx.createRadialGradient(center, center, 40, center, center, radius);
        gradient.addColorStop(0, colors[i % colors.length][0]);
        gradient.addColorStop(1, colors[i % colors.length][1]);

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = gradient;
        ctx.fill();

        ctx.strokeStyle = "rgba(255,255,255,0.76)";
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(start + slice / 2);

        const label = options[i];
        const fontSize = options.length > 10 ? 20 : options.length > 8 ? 23 : 28;
        ctx.font = "900 " + fontSize + "px Arial";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";

        ctx.shadowColor = "rgba(0,0,0,0.32)";
        ctx.shadowBlur = 5;
        ctx.fillStyle = "white";

        const maxWidth = radius - 88;
        let display = label;
        while (ctx.measureText(display).width > maxWidth && display.length > 4) {
          display = display.slice(0, -2) + "…";
        }

        ctx.fillText(display, radius - 32, 0);
        ctx.restore();
      }

      ctx.save();
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, 2 * Math.PI);
      ctx.strokeStyle = "rgba(17,24,39,0.12)";
      ctx.lineWidth = 8;
      ctx.stroke();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(center, center, 72, 0, 2 * Math.PI);
      ctx.fillStyle = "#111827";
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.stroke();

      ctx.fillStyle = "white";
      ctx.font = "900 22px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("LUNCH", center, center - 5);

      ctx.font = "700 13px Arial";
      ctx.fillStyle = "rgba(255,255,255,0.72)";
      ctx.fillText("SPIN", center, center + 19);
    }

    function spinWheel() {
      if (spinning || options.length < 2) return;

      spinning = true;
      resultCard.style.display = "none";
      result.textContent = "";
      spinButton.disabled = true;

      const spins = Math.random() * 4 + 7;
      const extra = Math.random() * 2 * Math.PI;
      const targetRotation = currentRotation + spins * 2 * Math.PI + extra;
      const duration = 4700;
      const start = performance.now();
      const initialRotation = currentRotation;

      function animate(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 4);

        currentRotation = initialRotation + (targetRotation - initialRotation) * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          currentRotation = currentRotation % (2 * Math.PI);
          const winner = getWinner();
          result.textContent = winner;
          resultCard.style.display = "block";
          spinning = false;
          spinButton.disabled = false;
        }
      }

      requestAnimationFrame(animate);
    }

    function getWinner() {
      const slice = (2 * Math.PI) / options.length;
      const pointerAngle = (3 * Math.PI / 2 - currentRotation + 2 * Math.PI) % (2 * Math.PI);
      const index = Math.floor(pointerAngle / slice) % options.length;
      return options[index];
    }

    function updateOptions() {
      const box = document.getElementById("optionsBox");
      const newOptions = box.value
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean);

      if (newOptions.length < 2) {
        alert("Please enter at least two lunch options.");
        return;
      }

      options = newOptions;
      resultCard.style.display = "none";
      result.textContent = "";
      currentRotation = -Math.PI / 2;
      drawWheel();
    }

    function resetWheel() {
      currentRotation = -Math.PI / 2;
      resultCard.style.display = "none";
      result.textContent = "";
      drawWheel();
    }

    spinButton.addEventListener("click", spinWheel);
    drawWheel();
  </script>
</body>
</html>
